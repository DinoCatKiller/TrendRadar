# ======================================================
# AI 智能分析（自动把大模型解读写进推送邮件）
# 支持所有 OpenAI 兼容接口；支持配置多个 provider 依次兜底
#   （某个免费额度排队 / 报错 / 超时，会自动尝试下一个）
# 常见预设：
#   OpenAI     → https://api.openai.com/v1
#   DeepSeek   → https://api.deepseek.com
#   通义千问    → https://dashscope.aliyuncs.com/compatible-mode/v1
#   Moonshot   → https://api.moonshot.cn/v1
#   硅基流动    → https://api.siliconflow.cn/v1
#   本地 Ollama → http://localhost:11434/v1
# 安全提示：api_key 建议用环境变量 AI_API_KEY 传入，避免明文落盘
# ======================================================
ai:
  enabled: true # 是否启用 AI 分析（关闭则邮件恢复为纯列表）

  # --- 方式一：单个 provider（顶层字段，环境变量 AI_BASE_URL/AI_API_KEY/AI_MODEL 优先）---
  base_url: "https://ollama.com/v1" # Ollama Cloud 的 OpenAI 兼容接口（已验证可用）
  api_key: "env:OLLAMA_API_KEY" # Ollama Cloud API Key（从环境变量/GitHub Secret 读取）
  model: "gemma4:31b" # 主模型（已验证可正常返回内容，快速稳定）

  # --- 方式二：多个 provider 兜底（推荐白嫖党用）---
  # 按顺序依次尝试，直到某个成功；全部失败则本次推送不含 AI 分析。
  # api_key 写成 env:环境变量名（密钥写在 config/secrets.env，不进 git）；
  # 对应的环境变量若没设置，该 provider 会被自动跳过，不会报错。
  providers:
    # - name: "Moonshot"
    #   base_url: "https://api.moonshot.cn/v1"
    #   api_key: "env:MOONSHOT_API_KEY"
    #   model: "moonshot-v1-8k"
    - name: "ollama"
      base_url: "https://ollama.com/v1"  # Ollama Cloud 端点（与顶层一致）
      api_key: "env:OLLAMA_API_KEY"  # Ollama Cloud API Key（从环境变量/GitHub Secret 读取）
      model: "nemotron-3-ultra:cloud"  # 备选大模型（550B，较慢且易返回空；gemma4:31b 为主用）

  max_news_in_prompt: 80 # 最多把多少条新闻标题喂给模型
  timeout: 120 # 单个 provider 请求超时（秒）
  max_tokens: 1500 # 分析结果最大长度
  temperature: 0.3 # 生成随机性，越小越稳定
  prompt: "" # 可选：自定义分析指令，留空使用默认指令
