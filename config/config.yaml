# RSS/Atom 官方源订阅（与上面的热搜平台合并监控）
# 说明：直接填官方博客 / 发布公告的 feed 地址即可，id 可省略（自动生成 rss_xxx）
#   抓取结果会与热搜平台合并，走同一套「关键词筛选 → 排序 → AI 分析 → 推送」逻辑
#   匹配为大小写不敏感的子串匹配，英文标题里的 Rust / Python / Go 等拉丁词可直接命中
# 提示：个别源可能已失效（日志会提示请求失败），不需要的直接删掉对应条目即可
# ======================================================
